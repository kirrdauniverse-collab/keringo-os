set timeout=5
set default=0
insmod vbe

# 0.5: biztonságos alapértelmezés — a régi monitorok miatt 640x480 az alap.
# A lemez indításánál 5 mp-ig választhatsz nagyobb módot a le/nyíl billentyűkkel.
menuentry "Keringo OS 0.5.0 — biztonsagos 640x480 (regi monitorokra)" {
    set gfxpayload=640x480x32
    multiboot /boot/keringo.elf
    boot
}
menuentry "Keringo OS 0.5.0 — normal 1024x768" {
    set gfxpayload=1024x768x32
    multiboot /boot/keringo.elf
    boot
}
menuentry "Keringo OS 0.5.0 — szeles 1280x800" {
    set gfxpayload=1280x800x32
    multiboot /boot/keringo.elf
    boot
}
menuentry "Keringo OS 0.5.0 — automatikus (a GRUB dont, 1024x768)" {
    set gfxpayload=auto
    multiboot /boot/keringo.elf
    boot
}
