set timeout=5
set default=0
insmod vbe

# 0.5.1: a multiboot-fejléc 640x480x16-ot ker (a spec-szerinti offsetre kerult,
# igy a GRUB valoban beallitja). Mas mod a menubol: a multiboot UTAN set gfxpayload!
menuentry "Keringo OS 0.5.1 — biztonsagos 640x480x16 (alapertelmezett)" {
    multiboot /boot/keringo.elf
    set gfxpayload=640x480x16
    boot
}
menuentry "Keringo OS 0.5.1 — 640x480x8 (max. kompatibilis, 8 bites szin)" {
    multiboot /boot/keringo.elf
    set gfxpayload=640x480x8
    boot
}
menuentry "Keringo OS 0.5.1 — 640x480x32 (teljes szin)" {
    multiboot /boot/keringo.elf
    set gfxpayload=640x480x32
    boot
}
menuentry "Keringo OS 0.5.1 — normal 1024x768x32" {
    multiboot /boot/keringo.elf
    set gfxpayload=1024x768x32
    boot
}
menuentry "Keringo OS 0.5.1 — automatikus (GRUB/EDID dontes)" {
    multiboot /boot/keringo.elf
    set gfxpayload=auto
    boot
}
